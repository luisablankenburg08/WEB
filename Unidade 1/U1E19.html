<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U1E19</title>
</head>
<body>
<form method="post">
    <h2> Cadastro de Usuários</h2>

    <div>
        <label for="name">Nome completo:</label>
        <input type="text" id="name" required>
    </div>

    <div>
        <label for="username">Login:</label>
        <input type="text" id="username" name="username" />
    </div>

    <div>
        <label for="pass">Senha:</label>
        <input type="password" id="pass" name="password"  />
    </div>

    <div>
        <label for="data">Data de nascimento:</label>
        <input type="date" id="data" required  />
    </div>
    
    <div> 
        <label for="status">Status:</label>
        <select id="status" name="status">
            <option value="fiat">Ativo</option>
            <option value="ford">Inativo</option>
        </select>
    </div>

    <div>
        <label for="name">Tipo:</label>

        <input type="radio" id="estudante"  required>
        <label for="name">Estudante</label>

        <input type="radio" id="professor"  required>
        <label for="name">Professor</label>

        <input type="radio" id="tecnico"  required>
        <label for="name">Técnico-Administrativo</label>
       
    </div>

    <div>
    <label for="observacoes">Observações:</label>
    <textarea id="observacoes" name="observacoes" > </textarea>
    </div>

    <div>
        <label for="name">Módulo:</label>


        <input type="checkbox" id="ensino" name="ensino">
        <label for="name">Ensino</label>
        
        <input type="checkbox" id="pesquisa" name="pesquisa">
        <label for="name">Pesquisa</label>
        
        <input type="checkbox" id="extensao" name="tecnologia" >
        <label for="name">Extensão</label>
    
    </div>
    <input type="submit" value="Cadastrar" />
    <input type="reset" value="Limpar">
</form>

</body>
</html>
