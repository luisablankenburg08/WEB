<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U1E17</title>
</head>
<body>
<form method="post">
    <h2> Cadastro de Produtos</h2>
    <div>
        <label for="name">Produto:</label>
        <input type="text" id="name" required>
    </div>

    <div>
    <label for="descricao">Descrição:</label>
    <textarea id="descricao" name="desc" required> </textarea>
    </div>

    <div>
    <label for="data">Data da compra:</label>
    <input type="date" id="data" required  />
    </div>

    <div>
    <label for="quantidade">Quantidade (5-50):</label>
    <input type="number" id="quantidade" name="quantidade" min="5" max="50" required />
    </div>

    <input type="submit" value="Enviar" />
</form>

</body>
</html>
