<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício com Botões e Divs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        .container {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .box {
            width: 100px;
            height: 100px;
            border: 2px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            margin-bottom: 20px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>Exercício com Botões e Divs</h1>
    <p>Cada botão altera o estilo de um `div` específico.</p>

    <button id="btn1">Altera o 1º Div</button>
    <button id="btn2">Altera o 2º Div</button>
    <button id="btn3">Altera o 3º Div</button>
    <button id="btn4">Altera o 4º Div</button>

    <div class="container">
        <div id="box1" class="box">Div 1</div>
        <div id="box2" class="box">Div 2</div>
        <div id="box3" class="box">Div 3</div>
        <div id="box4" class="box">Div 4</div>
    </div>

    <script>
        //botoes
        var btn1 = document.getElementById("btn1")
        var btn2 = document.getElementById("btn2")
        var btn3 = document.getElementById("btn3")
        var btn4 = document.getElementById("btn4")

        //divs
        var div1 = document.getElementById("box1")
        var div2 = document.getElementById("box2")
        var div3 = document.getElementById("box3")
        var div4 = document.getElementById("box4")

        btn1.addEventListener("click", function() {
            let angulo = 45
            div1.style.transform = `rotate(${angulo}deg)`;
            div1.style.backgroundColor = "lightblue"
        })       

        btn2.addEventListener("click", function() {
            div2.style.borderRadius = '50%';
            div2.style.backgroundColor = "lightgreen"
        })       

        btn3.addEventListener("click", function() {
            div3.style.width = '150px';
            div3.style.backgroundColor = "lightcoral"
        })   
        
        btn4.addEventListener("click", function() {
            div4.style.height = '150px';
            div4.style.backgroundColor = "lightyellow"
        })       
    </script>

</body>
</html>
