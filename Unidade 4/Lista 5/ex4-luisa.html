<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Origem e Destino</title>
    <link href="eventos.css" rel="stylesheet">
</head>

<body>
    <div class="form-container">
        <label for="n1">Número 1:</label>
        <input type="text" id="n1">
        <label for="n2">Número 2:</label>
        <input type="text" id="n2">
        <label for="result">Resultado:</label>
        <input type="text" id="result">
        <button id="botaoSomar" type="submit">Somar</button>
        <button id="botaoSubtrair" type="submit">Subtrair</button>
        <button id="botaoMultiplicar" type="submit">Multiplicar</button>
        <button id="botaoDividir" type="submit">Dividir</button>
    </div>
    <script>
        var numero1 = document.getElementById("n1");
        var numero2 = document.getElementById("n2");

        function somar() {
            let soma = parseFloat(numero1.value) + parseFloat(numero2.value);
            document.getElementById("result").value = soma;
        };

        function subtrair() {
            let subtracao = parseFloat(numero1.value) - parseFloat(numero2.value);
            document.getElementById("result").value = subtracao;
        };

        function multiplicar() {
            let multiplicacao = parseFloat(numero1.value) * parseFloat(numero2.value);
            document.getElementById("result").value = multiplicacao;
        };

        function dividir() {
            let divisao = parseFloat(numero1.value) / parseFloat(numero2.value);
            document.getElementById("result").value = divisao;
        };

        var botaoSomar = document.getElementById("botaoSomar");
        var botaoSubtrair = document.getElementById("botaoSubtrair");
        var botaoMultiplicar = document.getElementById("botaoMultiplicar");
        var botaoDivisao = document.getElementById("botaoDivisao");

        botaoSomar.addEventListener("click", somar);
        botaoSubtrair.addEventListener("click", subtrair);
        botaoDividir.addEventListener("click", dividir);
        botaoMultiplicar.addEventListener("click", multiplicar);
    </script>
</body>

</html>
