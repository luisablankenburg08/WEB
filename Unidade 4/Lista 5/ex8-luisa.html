<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }

        .calculator {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 320px;
        }

        .display {
            width: 100%;
            height: 50px;
            font-size: 24px;
            text-align: right;
            padding: 10px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            width: 100%;
            padding: 20px;
            font-size: 18px;
            background-color: #eee;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
        }

        button.operator {
            background-color: #ff9900;
            color: white;
        }

        button.equals {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" class="display" readonly>
        <div class="buttons">
            <button id="btn7">7</button>
            <button id="btn8">8</button>
            <button id="btn9">9</button>
            <button id="divide" class="operator">/</button>

            <button id="btn4">4</button>
            <button id="btn5">5</button>
            <button id="btn6">6</button>
            <button id="multiply" class="operator">*</button>

            <button id="btn1">1</button>
            <button id="btn2">2</button>
            <button id="btn3">3</button>
            <button id="subtract" class="operator">-</button>

            <button id="btn0">0</button>
            <button id="decimal">.</button>
            <button id="equals" class="equals">=</button>
            <button id="add" class="operator">+</button>

            <button id="clear" class="operator" colspan="4">C</button>
        </div>
    </div>
    <script>
        var visor = document.getElementById("display");
        var btn1 = document.getElementById("btn1");
        var btn2 = document.getElementById("btn2");
        var btn3 = document.getElementById("btn3");
        var btn4 = document.getElementById("btn4");
        var btn5 = document.getElementById("btn5");
        var btn6 = document.getElementById("btn6");
        var btn7 = document.getElementById("btn7");
        var btn8 = document.getElementById("btn8");
        var btn9 = document.getElementById("btn9");
        var btn0 = document.getElementById("btn0");

        var dividir = document.getElementById("divide");
        var multiplicar = document.getElementById("multiply");
        var subtrair = document.getElementById("subtract");        
        var somar = document.getElementById("add");

        var ponto = document.getElementById("decimal");
        var igual = document.getElementById("equals");
        var limpar = document.getElementById("clear");

        var lista = [btn1, btn2, btn3, btn4, btn5, btn6, btn7, btn8, btn9, btn0, dividir, multiplicar, subtrair, somar, ponto];

        for (let i = 0; i < lista.length; i++) {
            lista[i].addEventListener("click", () => {
                visor.value  += lista[i].textContent}); 
        }
        
        limpar.addEventListener("click", () => {
            visor.value  = ""
        })

        igual.addEventListener("click", () => {
            visor.value  = eval(visor.value)
        })


    </script>

</body>
</html>
