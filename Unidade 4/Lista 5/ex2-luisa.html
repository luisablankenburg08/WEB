<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos</title>
    <link href="eventos.css" rel="stylesheet">
</head>

<body>
    <div class="form-container">
        <label for="numero">Número:</label>
        <input type="text" id="numero" name="numero" />
        <br />
        <label for="resultado">Resultado:</label>
        <input type="text" id="resultado" name="resultado" />
        <br />
        <button id="botao">
            Multiplica por 2
        </button>
    </div>
    <script>

        var botao = document.getElementById("botao")

        function adicionarResultado() {
            var numero = document.getElementById("numero")
            var valor = parseFloat(numero.value);
            document.getElementById("resultado").value = valor * 2;
        };

        botao.addEventListener("click", adicionarResultado)
    </script>

</body>

</html>
