<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos</title>
    <link href="eventos.css" rel="stylesheet">
</head>

<body>
    <div class="form-container">
        <h2>Jogo Clique para Vencer!</h2>

        <button id="botao1">
            Clique aqui para VENCER!
        </button>
        <button id="botao2">
            Clique aqui para PERDER!
        </button>
    </div>
    <script>
        var botao1 = document.getElementById("botao1");
        var botao2 = document.getElementById("botao2");

        botao1.addEventListener("mouseenter", () => {
            botao1.innerText = "Clique aqui para PERDER!";
            botao2.innerText = "Clique aqui para VENCER!";
        });

        botao1.addEventListener("mouseleave", () => {
            botao1.innerText = "Clique aqui para VENCER!"
            botao2.innerText = "Clique aqui para PERDER!";
        });

        botao1.addEventListener("click", () => {
            alert("Você perdeu!"); })
        botao2.addEventListener("click",() => {
            alert("Você perdeu!"); })

    </script>
</body>

</html>
