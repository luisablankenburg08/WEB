<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidade 4 - Lista 2</title>
</head>
<body>
    <script>
        var fruta=prompt("Digite o nome de uma fruta que comece com A: ");
        switch(fruta) {
            case 'abacate':
                document.write("Fruta verde e oval");
                break;
            case 'amora':
                document.write("Fruta vermelha ou roxa e pequena");
                break;
            case 'abacaxi':
                document.write("Fruta azeda e doce");
                break;
            case 'acerola':
                document.write("Fruta verleha e pequena");
                break;
            case 'ameixa':
                document.write("Fruta doce e roxa");
                break;
            case 'açaí':
                document.write("Fruta roxa do Amazonas");
                break;
            default:
                document.write("Não sei nada sobre essa fruta")
                break;
        }

    </script>
</body>
</html>
