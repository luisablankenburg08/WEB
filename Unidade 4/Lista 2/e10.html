<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidade 4 - Lista 2</title>
</head>
<body>
    <script>
        var num = parseInt(prompt("Digite um número: "))
        var contador = 0
        if (num >=1) {
            while (contador<=num) {
                if (contador % 2 === 0) {
                    document.write(contador);
                }
                contador++;
                document.write('<br>');
            }
        }
    </script>
</body>
</html>
