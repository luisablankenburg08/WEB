<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidade 4 - Lista 2</title>
</head>
<body>
    <script>
        var soma = 0;
        var qtde = 0;
        do {
            var num = parseInt(prompt("Digite um número: "));
            soma +=num;
            qtde++; 
        } while (num != 0);
        
        media = soma/(qtde-1);
        document.write (`Quantidade: ${qtde-1} <br> Soma: ${soma} <br> Média: ${media}`)
        
    </script>
</body>
</html>
