<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidade 4 - Lista 2</title>
</head>
<body>
    <script>
        var num = parseInt(prompt("Digite um número: "))
        var contador = 1
        if (num >=1) {
            while (contador<=num) {
                document.write(contador);
                document.write("<br>");
                contador++;
            }
        } else if (num < 1) {
            while (contador>=num) {
                document.write(contador);
                document.write("<br>");
                contador--;
            }
        }
    </script>
</body>
</html>
