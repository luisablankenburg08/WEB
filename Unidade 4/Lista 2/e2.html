<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidade 4 - Lista 2</title>
</head>
<body>
    <script>
        var clas=prompt("Digite uma classificação indicativa: ")

        switch (clas) {
            case "L":
                document.write("Classificação Livre");
                break;
            case "10":
                document.write("Apenas maiores de 10 anos");
                break;
            case "12":
                document.write("Apenas maiores de 12 anos"); 
                break;
            case "14":
                document.write("Apenas maiores de 14 anos");
                break;
            case "16":
                document.write("Apenas maiores de 16 anos");
                break;
            case "18": 
                document.write("Apenas maiores de 18 anos");
                break;
         }

    </script>
</body>
</html>
