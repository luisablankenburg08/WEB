<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidade 4 - Lista 2</title>
</head>
<body>
    <script>
        var tab = parseInt(prompt("Digite um número para encontrar a tabuada: "))
        var ini = parseInt(prompt("Digite um número para começar a tabuada: "))
        var ter = parseInt(prompt("Digite um número para terminar a tabuada: "))

        for (ini; ini<=ter; ini++) {
            document.write(tab, ' x ', ini, ' = ', ini*tab, '<br>')

        }
    </script>
</body>
</html>
