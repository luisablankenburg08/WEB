<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidade 4 - Lista 2</title>
</head>
<body>
    <script>

        let palavra = prompt("Escreva uma palavra: ")
        let inversao = palavra.split("").reverse().join(""); //split: lista com cada letra separada; reverse: inverte os itens da lista; join: junta tudo invertido
        document.write(inversao)

    </script>
</body>
</html>
