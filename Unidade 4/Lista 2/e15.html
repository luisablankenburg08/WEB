<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidade 4 - Lista 2</title>
</head>
<body>
    <script>
        var meses = parseInt(prompt("Digite a quantidade de meses: "))
        var divida = 1000;
        for (let i = 1; i<=meses; i++) {
            divida += divida*0.153
        };
        document.write('A dívida final é: ', divida.toFixed(2))
    </script>
</body>
</html>
