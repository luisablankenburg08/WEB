<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidade 4 - Lista 2</title>
</head>
<body>
    <script>
        var pag=parseInt(prompt("Digite 1 para débito, 2 para crédito e 3 para dinheiro"));

        switch (pag) {
            case 1:
                document.write("Pagamento: débito");
                break;
            case 2:
                document.write("Pagamento: crédito");
                break;
            case 3:
                document.write("Pagamento: dinheiro")
        }
    </script>
</body>
</html>
