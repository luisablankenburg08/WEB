<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidade 4 -Lista 4</title>
</head>
<body>
    <script>

        function tempoTotal(h, m) {
            let conversao = h*60;
            let total = conversao + m;
            document.write(`O tempo total em minutos é: ${total}`);
        };

        var horas = parseInt(prompt("Digite a quantidade de horas: "));
        var minutos = parseInt(prompt("Digite a quantidade de minutos: "));

        tempoTotal(horas,minutos);

    </script>
</body>
</html>
