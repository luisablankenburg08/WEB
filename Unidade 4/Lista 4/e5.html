<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidade 4 -Lista 4</title>
</head>
<body>
    <script>

        function traduzirGiria(a) {
            let giria = ""

            if (a.includes("feliz")) {
                giria = a.replace("feliz", "animadão");
            } 
            else if (a.includes("briga")) {
                giria = a.replace("briga", "treta");
            } 
            else if (a.includes("bem")) {
                giria = a.replace("bem", "firmeza");
            }
            else if (a.includes("vergonha alheia")) {
                giria = a.replace("vergonha alheia", "cringe");
            }
            return giria;
        };

        var frase = prompt("Digite uma frase: ");
        document.write(traduzirGiria(frase));

    </script>
</body>
</html>
