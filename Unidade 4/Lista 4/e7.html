<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidade 4 -Lista 4</title>
</head>
<body>
    <script>

        function somar(array) {
            let soma = 0

            for (let i = 0; i < array.length; i++) {
                soma += array[i]
            };

            return (`A soma dos números é: ${soma}`);
        };

        var lista = [];

        for (let i = 1; i < 5; i++) {
            let num = parseFloat(prompt(`Digite o número ${i}: `))
            lista.push(num)
        };

       document.write(somar(lista));


    </script>
</body>
</html>
