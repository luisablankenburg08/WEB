<body>
    <script>

        function calcularIdadeNoFuturo(nome, idade, anos) {
            idadeSomada= idade + anos;
            document.write(`${nome} terá ${idadeSomada} daqui a ${anos} anos`);
        };

        var nome = prompt("Digite seu nome: ");
        var idade = parseInt(prompt("Digite sua idade: "));

        calcularIdadeNoFuturo(nome, idade, 10);

    </script>
