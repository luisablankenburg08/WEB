<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidade 4 -Lista 4</title>
</head>
<body>
    <script>

        function sortearGanhador(array) {
            let indice = Math.floor(Math.random() * array.length)
            let ganhador = array[indice]
            return `O ganhador é: ${ganhador}`
        }


        var nomes = []

        for (let i=1; i<6; i++) {
            let nome = prompt(`Digite o nome ${i} de 5: `)
            nomes.push(nome)
        }

        document.write(sortearGanhador(nomes))
    </script>
</body>
</html>
