<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidade 4 -Lista 4</title>
</head>
<body>
    <script>

        function gerarNomeDeJogador(name) {
            const caracteres = ['*', '@', '#', '-', '_'];

            let indiceC = Math.floor(Math.random() * caracteres.length);
            let numero = Math.floor(Math.random() *1000) + 1;

            let posicao = Math.random() >= 0.5;

            if (posicao==true) {
                posicao = !posicao
                return `${name}${caracteres[indiceC]}${numero}}`
            } else {
                return `${name}${numero}${caracteres[indiceC]}}`
            }

        };
        
        var nome = prompt("Digite um nome: ")
        document.write(gerarNomeDeJogador(nome))



    </script>
</body>
</html>
