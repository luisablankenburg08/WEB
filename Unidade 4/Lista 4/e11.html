<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidade 4 -Lista 4</title>
</head>
<body>
    <script>

        function formatar(d) {

            const unidades = ['um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove'];
            const entre = ['dez', 'onze', 'doze', 'treze', 'quatorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];
            const dezenas = ['vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];
            const centenas = ['cem'];
            const meses = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro']


            let divisao = d.split("/");
            let dia = divisao[0];
            let mes = divisao[1];
            let ano = divisao[2];
            let anoSeparado = ano.split('')
            let centena = ''
            let dezena = ''
            let unidade = ''

            // VERIFICAR DIA
            for (let i=1; i <10;i++) {
                if (dia==`0${i}`) {
                    dia = unidades[i-1]
                }
                else if (dia==`10`) {
                    dia = entre[0]
                } 
                else if (dia==`1${i}`) {
                    dia = entre[i]
                }
                else if (dia==`20`) {
                    dia = dezenas[0]
                } 
                else if (dia==`2${i}`) {
                    dia = `${dezenas[0]} e ${unidades[i-1]}` 
                } 
                else if (dia==`30`) {
                    dia = dezenas[1]
                } 
                else if (dia==`31`) {
                    dia = `${dezenas[1]} e ${unidades[0]}` 
                }
            }

            //VERIFICAR MÊS
            for (let i=1;  i <13; i++) {
                if (mes==`0${i}`) {
                    mes = meses[i-1]
                }
                else if (mes==`10`) {
                    mes = meses[9]
                }
                else if (mes==`11`) {
                    mes = meses[10]
                }
                else if (mes==`12`) {
                    mes = meses[11]
                }
            }

            // VERIFICAR ANO - CENTENA
            if (anoSeparado[1] == '1') {
                centena = ' e cem'
            }

            // VERIFICAR ANO - DEZENA 0 NADA MUDA

            // VERIFICAR ANO - DEZENA 1
            if (anoSeparado[2]== 1) {
                for (let i=0; i <11; i++) {
                    if (anoSeparado[3]==i) {
                        dezena = `${entre[i]} `
                    };
                }
            }

            // VERIFICAR ANO - DEZENA MAIOR QUE 1
            for (let i = 2; i <11; i++) {
                if (anoSeparado[2]== i && anoSeparado[3]=='0') {
                    dezena = `${dezenas[i-2]}`
                }
                else if (anoSeparado[2]== i && anoSeparado[3]!='0' ) {
                    dezena = `${dezenas[i-2]} e `
                }
            }

            // VERIFICAR ANO - UNIDADE 
            if (anoSeparado[3]!= '0') {
                for (let i=1; i <10; i++) {
                    if (anoSeparado[3] == i) {
                        unidade = `${unidades[i-1]}`
                    }
                }
            }
            
            return dia + " de " + mes + " de dois mil"  + centena + dezena + unidade
        }
   
        data = prompt("Digite uma data doas anos 2000 até 2100 (ex: 03/12/2002): ");
        console.log(formatar(data));

    </script>
</body>
</html>
