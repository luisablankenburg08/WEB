<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidade 4 -Lista 4</title>
</head>
<body>
    <script>

        function embaralhar(p) {
            let letras = p.split("");

            letras.sort(() => Math.random() - 0.5);
            
            normal = letras.join('');

            return normal.toLowerCase()
        }

        var palavra = prompt(`Digite uma palavra: `);
  
        document.write(embaralhar(palavra));
    </script>
</body>
</html>
