<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidade 4 - Lista 3</title>
</head>
<body>
    <script>
        numeros = [23, 45, 67, 12, 89, 34]
        var maior = 0
        for (let i = 0; i < numeros.length; i++) {
            if (numeros[i] > maior) {
                maior = numeros[i]
            }
        }
        document.write("O maior número é: ", maior)
    </script>
</body>
</html>
