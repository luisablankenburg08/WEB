<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Unidade 4 - Lista 3</title>
</head>
<body>
    <div id="jogo"></div>
    <script>
        var matriz = [
            ['-','-','-'],
            ['-','-','-'],
            ['-','-','-']
        ]

        var jogador = true

        function verificarVitoria () {

            linha = 0
            coluna = 0      
            
            // VERIFICA LINHAS
            if (matriz[linha][coluna] == matriz[linha][coluna+1] && matriz[linha][coluna+1] ==  matriz[linha][coluna+2]) {
                document.write('Vitória!') }

            else if (matriz[linha+1][coluna] == matriz[linha+1][coluna+1]&& matriz[linha+2][coluna+1] == matriz[linha+1][coluna+2]) {
                document.write('Vitória!') }

            else if (matriz[linha+2][coluna] == matriz[linha+2][coluna+1] && matriz[linha+2][coluna+1]== matriz[linha+2][coluna+2]) {
                document.write('Vitória!') }

            //VERIFICA COLUNAS
            if (matriz[linha][coluna] == matriz[linha+1][coluna] && matriz[linha+1][coluna] == matriz[linha+2][coluna]) {
                document.write('Vitória!') }

            else if (matriz[linha][coluna+1] == matriz[linha+1][coluna+1] && matriz[linha+1][coluna+1] == matriz[linha+2][coluna+1]) {
                document.write('Vitória!') }

            else if (matriz[linha][coluna+2] == matriz[linha+1][coluna+2] && matriz[linha+1][coluna+2] == matriz[linha+2][coluna+2]) {
                document.write('Vitória!') }

            }
        
        function renderizar() {
            html = ''
            html += 'JOGO DA VELHA <br>'
            html += '<pre>'
            html +='1|2|3 \n'

            for (const linha of matriz) {
                html += linha.join('|') + "\n";
            }

            if (jogador==true) {
                html +='Jogador atual: X <br>'
            }
            else { html +='Jogador atual: O <br>'}

            html += '</pre>'

            html += "<label for='linha'>Escolha a posição da linha:</label>"
            html +="<input type='number' id='linha' min='1' max='3'></input> <br>"


            html += "<label for='coluna'>Escolha a posição da coluna:</label>"
            html += "<input type='number' id='coluna' min='1' max='3'></input> <br>"

            html += "<button onclick=desenhar()>Desenhar</button> <br>"

            document.getElementById('jogo').innerHTML = html;
        }

        function desenhar() {
            linha = document.getElementById('linha').value;
            coluna = document.getElementById('coluna').value;

            if (matriz[linha - 1][coluna - 1] == '-') {
                if (jogador==true) {
                    matriz[linha - 1][coluna - 1] = "X";
                }
                else {matriz[linha - 1][coluna - 1] = "O"};
            }

            else {console.log("essa posição já está ocupada")}

            jogador = !jogador; 

            renderizar()
            verificarVitoria()
        }

        renderizar()

    </script>
   
</body>
</html>
