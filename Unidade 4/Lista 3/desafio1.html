<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Unidade 4 - Lista 3</title>
</head>
<body>
    <div id="jogo"></div>
    <script>
        var matriz = [
            ['-','-','-'],
            ['-','-','-'],
            ['-','-','-']
        ]

        var jogador = true

        function renderizar() {
            html = ''
            html += 'JOGO DA VELHA <br>'
            html += '<pre>'
            html +='1|2|3 \n'

            for (const linha of matriz) {
                html += linha.join('|') + "\n";
            }

            if (jogador==true) {
                html +='Jogador atual: X <br>'
            }
            else { html +='Jogador atual: O <br>'}

            html += '</pre>'

            html += "<label for='linha'>Escolha a posição da linha:</label>"
            html +="<input type='number' id='linha' min='1' max='3'></input> <br>"


            html += "<label for='coluna'>Escolha a posição da coluna:</label>"
            html += "<input type='number' id='coluna' min='1' max='3'></input> <br>"

            html += "<button onclick=desenhar()>Desenhar</button> <br>"

            document.getElementById('jogo').innerHTML = html;
        }

        function verificarVitoria () {

            // VERIFICA LINHAS
            if ( (matriz[0][0] == matriz[0][1]) && (matriz[0][1] ==  matriz[0][2]) && (matriz[0][1] != '-') ){
                document.write('Vitória!') }

            else if (matriz[1][0] == matriz[1][1] && matriz[1][1] ==  matriz[1][2]  && matriz[1][1] != '-') {
                document.write('Vitória!') }

            else if (matriz[2][0] == matriz[2][1] && matriz[2][1] ==  matriz[2][2] && matriz[2][1]!='-' ){
                document.write('Vitória!') }

            //VERIFICA COLUNAS
            if (matriz[0][0] == matriz[1][0] && matriz[1][0] == matriz[2][0] && matriz[1][0]!= '-' ){
                document.write('Vitória!') }

            else if (matriz[0][1] == matriz[1][1] && matriz[1][1] == matriz[2][1] && matriz[1][1]!='-'){
                document.write('Vitória!') }

            else if (matriz[0][2] == matriz[1][2] && matriz[1][2] == matriz[2][2] && matriz[1][2]!='-' ){
                document.write('Vitória!') }

            //VERIFICA DIAGONAIS

            if (matriz[0][0] == matriz[1][1] && matriz[1][1] == matriz[2][2] && matriz[1][1]!= '-' ){
                document.write('Vitória!')}

            else if (matriz[0][2] == matriz[1][1] && matriz[1][1] == matriz[2][0] && matriz[1][1]!='-'){
                document.write('Vitória!') }

        }

        function desenhar() {
            linha = document.getElementById('linha').value;
            coluna = document.getElementById('coluna').value;

            if (matriz[linha - 1][coluna - 1] == '-') {
                if (jogador==true) {
                    matriz[linha - 1][coluna - 1] = "X";
                }
                else {matriz[linha - 1][coluna - 1] = "O"};
            }

            else {console.log("essa posição já está ocupada")}

            jogador = !jogador; 

            renderizar()
            verificarVitoria()
        }

        renderizar()


    </script>
   
</body>
</html>
