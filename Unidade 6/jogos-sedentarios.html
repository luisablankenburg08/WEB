<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos Sedentários</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
</head>
<body>
    <div class="container my-4">
        <h2>Jogos sedentários</h2>
        <div class="row g-4">
            <div class="col-md-8">
                <form>
                    <legend>Inscreva-se</legend>
                    <div class="mb-3">
                        <label for="exampleInputName" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="exampleInputName" placeholder="Seu nome completo">
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="voce@exemplo.com">
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputClass" class="form-label">Turma</label>
                        <input type="text" class="form-control" id="exampleInputClass" placeholder="Ex.: INFO 3">
                    </div>
                    <div class="mb-3">
                        <label for="disabledSelect" class="form-label">Jogo</label>
                        <select id="disabledSelect" class="form-select">
                          <option>Escolha o campeonato</option>
                        </select>
                      </div>
                    <div class="mb-3">
                        <label class="form-label d-block">Plataforma</label>
                      
                        <div class="form-check form-check-inline">
                          <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1" value="option1">
                          <label class="form-check-label" for="inlineRadio1">PC (laboratório)</label>
                        </div>
                      
                        <div class="form-check form-check-inline">
                          <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2" value="option2">
                          <label class="form-check-label" for="inlineRadio2">Playstation 5</label>
                        </div>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="exampleCheck1">
                        <label class="form-check-label" for="exampleCheck1">Li e aceito o regulamento</label>
                    </div>
                    <button type="submit" class="btn btn-primary">Inscrever</button>
                </form>
            </div>
            <div class="col-md-4">
                <form>
                    <legend>Já me inscrevi</legend>
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
                            <label for="floatingInput">E-mail</label>
                        </div>
                        <div class="form-floating">
                            <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
                            <label for="floatingPassword">Código de inscrição</label>
                        </div>
                        <button type="submit" class="btn btn-outline-primary mt-3 ">Consultar</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
